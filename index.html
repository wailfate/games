<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wailfate 게임 상점</title>
<meta name="description" content="역사 전략 게임 모음 — Google Play에서 받기">
<meta property="og:type" content="website">
<meta property="og:title" content="wailfate 게임 상점">
<meta property="og:description" content="역사 전략 게임 모음 — Google Play에서 받기">
<meta property="og:image" content="https://wailfate.github.io/games/img/aod2.png">
<meta property="og:url" content="https://wailfate.github.io/games/">
<style>
:root{--bg:#14110d;--card:#1f1a13;--ink:#eadfc8;--mute:#b3a68c;--gold:#c8a24a}
@media (prefers-color-scheme:light){:root{--bg:#f6f1e6;--card:#fff;--ink:#2a2216;--mute:#6b5f48;--gold:#a8821f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
h1{margin:0;font-size:1.6rem}
.sub{color:var(--mute);margin:6px 0 24px}
.card{display:flex;gap:14px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;align-items:flex-start}
.card img{width:72px;height:72px;border-radius:16px;flex:none}
.card h2{margin:0 0 2px;font-size:1.05rem}
.tag{font-size:.75rem;color:var(--gold)}
.card p{margin:6px 0 10px;color:var(--mute);line-height:1.5;font-size:.9rem}
.card a{display:inline-block;padding:8px 16px;border-radius:8px;background:var(--gold);color:#1a1408;font-weight:700;text-decoration:none;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1 id="t">wailfate 게임 상점</h1>
<p class="sub" id="s"></p>
<div id="list"></div>
</main>
<script>
// 게임 목록은 games.json 에서 읽는다 — 새 게임은 그 파일에만 더하면 된다
var src=new URLSearchParams(location.search).get("src")||"shop";
fetch("games.json").then(function(r){return r.json()}).then(function(d){
  document.getElementById("t").textContent=d.title;
  document.getElementById("s").textContent=d.subtitle;
  var box=document.getElementById("list");
  d.games.forEach(function(g){
    var url="https://play.google.com/store/apps/details?id="+g.package+"&referrer="+encodeURIComponent("utm_source=shop&utm_medium="+src+"&utm_campaign="+g.id);
    var c=document.createElement("div");c.className="card";
    var img=document.createElement("img");img.src="img/"+g.id+".png";img.alt=g.name;
    var b=document.createElement("div");
    var h=document.createElement("h2");h.textContent=g.name;
    var tg=document.createElement("div");tg.className="tag";tg.textContent=g.genre;
    var p=document.createElement("p");p.textContent=g.tagline;
    var a=document.createElement("a");a.href=url;a.textContent="Google Play에서 받기";
    b.append(h,tg,p,a);c.append(img,b);box.append(c);
  });
}).catch(function(){document.getElementById("s").textContent="목록을 불러오지 못했습니다."});
</script>
</body>
</html>
