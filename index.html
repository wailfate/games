<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wailfate 게임 상점</title>
<meta name="description" content="역사 전략 게임 모음 — Google Play에서 받기">
<meta property="og:type" content="website">
<meta property="og:title" content="wailfate 게임 상점">
<meta property="og:description" content="역사 전략 게임 모음 — Google Play에서 받기">
<meta property="og:image" content="https://wailfate.github.io/games/img/aod2.png">
<meta property="og:url" content="https://wailfate.github.io/games/">
<style>
:root{--bg:#14110d;--card:#1f1a13;--line:#3a3020;--ink:#eadfc8;--mute:#b3a68c;--gold:#c8a24a;--btn:#1a1408}
@media (prefers-color-scheme:light){:root{--bg:#f6f1e6;--card:#fff;--line:#e3d9c0;--ink:#2a2216;--mute:#6b5f48;--gold:#a8821f;--btn:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}
main{height:100dvh;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
header{text-align:center;flex:none}
.kick{color:var(--gold);letter-spacing:.3em;font-size:.7rem}
h1{margin:4px 0 2px;font-size:clamp(1.2rem,4.5vh,1.7rem)}
.sub{margin:0;color:var(--mute);font-size:.85rem}
#list{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{flex:1;min-height:0;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:var(--bg-img) center/cover;opacity:.12;filter:blur(18px)}
.card>*{position:relative}
.card img{height:min(100%,92px);aspect-ratio:1;border-radius:20px;flex:none;box-shadow:0 4px 14px #0006}
.body{min-width:0;display:flex;flex-direction:column;gap:3px}
.tag{font-size:.72rem;color:var(--gold)}
h2{margin:0;font-size:clamp(.95rem,2.8vh,1.15rem);line-height:1.25}
p{margin:0;color:var(--mute);line-height:1.4;font-size:clamp(.72rem,1.9vh,.85rem);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card a{align-self:flex-start;margin-top:4px;padding:7px 14px;border-radius:999px;background:var(--gold);color:var(--btn);font-weight:700;text-decoration:none;font-size:.82rem}
footer{flex:none;text-align:center;color:var(--mute);font-size:.7rem}
</style>
</head>
<body>
<main>
<header><div class="kick">WAILFATE GAMES</div><h1 id="t">wailfate 게임 상점</h1><p class="sub" id="s"></p></header>
<div id="list"></div>
<footer>Google Play에서 무료로 받기</footer>
</main>
<script>
// 게임 목록은 games.json 에서 읽는다 — featured:true 인 게임만 보인다(하나도 없으면 전부)
var src=new URLSearchParams(location.search).get("src")||"shop";
fetch("games.json").then(function(r){return r.json()}).then(function(d){
  document.getElementById("t").textContent=d.title;
  document.getElementById("s").textContent=d.subtitle;
  var box=document.getElementById("list");
  var fs=d.games.filter(function(g){return g.featured});
  (fs.length?fs:d.games).forEach(function(g){
    var url="https://play.google.com/store/apps/details?id="+g.package+"&referrer="+encodeURIComponent("utm_source=shop&utm_medium="+src+"&utm_campaign="+g.id);
    var c=document.createElement("div");c.className="card";c.style.setProperty("--bg-img","url(img/"+g.id+".png)");
    var img=document.createElement("img");img.src="img/"+g.id+".png";img.alt=g.name;
    var b=document.createElement("div");b.className="body";
    var h=document.createElement("h2");h.textContent=g.name;
    var tg=document.createElement("div");tg.className="tag";tg.textContent=g.genre;
    var p=document.createElement("p");p.textContent=g.tagline;
    var a=document.createElement("a");a.href=url;a.textContent="Google Play에서 받기";
    b.append(h,tg,p,a);c.append(img,b);box.append(c);
  });
}).catch(function(){document.getElementById("s").textContent="목록을 불러오지 못했습니다."});
</script>
</body>
</html>
